<!DOCTYPE html>
<html>

<head>
<style>
body {
  margin: 0;
  padding: 0;
}

p {
  margin: 15px;
}

h2 {
  margin: 15px;
  text-align: center;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: rgb(40, 44, 57);
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: rgb(255, 242, 205);
  text-align: center;
  padding: 15px 15px;
  text-decoration: none;
}

ul li a:hover {
  background-color: black;
}

th, td, h1 {
  padding: 15px 15px;
  text-align: center;
  }
    
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
  }
</style>
</head>
<body>

<ul>
  <li><a href="schedule.html">Schedule</a></li>
  <li><a href="#news">Information Input</a></li>
</ul>

<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Daily schedule</h1>
  {% for item in people %}
  <form action="/choose" method="post">
      <input type="submit" id="{{ item }}" name="{{ item }}" value="{{ item }}">
  </form>
  {% endfor %}

  <table style="margin-left: auto; margin-right: auto;">
    <thead> <h2>{{ name }}</h2>
      <tr>
        <th>Time</th>
        <th>Task</th>
        <!-- <th>Duration</th> -->
      </tr>
    </thead>
    <tbody>
      {% for item in schedule %}
      <tr>
        <td>{{ item.start_time }} – {{ item.end_time }}</td>
        <td>{{ item.task }}</td>
        <!--<td>{{ item.duration }} min</td> -->
      </tr>
      {% endfor %}
</tbody>
  </table>
  <h3>Input new health data for {{ name }}</h3>
        <form action="/submit" method="post">
            <label for="bp">Current Blood Pressure: </label>
            <input type="text" id="bp" name="bp"> <br>

            <label for="bdDecay">Bone Density Decay: </label>
            <input type="text" id="bdDecay" name="bdDecay"> <br>

            <label for="restHR">Resting Heart Rate: </label>
            <input type="text" id="restHR" name="restHR"> <br>

            <label for="bodyTemp">Body Temperature </label>
            <input type="text" id="bodyTemp" name="bodyTemp"> <br>

            <label for="weightChange">Weight Change: </label>
            <input type="text" id="weightChange" name="weightChange"> <br>

            <label for="sleep">Sleep Time (in mins): </label>
            <input type="text" id="sleep" name="sleep"> <br>

            <input type="submit" value="Submit">
        </form>
</body>
</html>
