<!DOCTYPE html>
<html>

<head>
<style>
body {
  margin: 0;
  padding: 0;
}

h2, p {
  margin: 15px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: rgb(40, 44, 57);
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: rgb(255, 242, 205);
  text-align: center;
  padding: 15px 15px;
  text-decoration: none;
}

ul li a:hover {
  background-color: black;
}

th, td, h1 {
  padding: 15px 15px;
  text-align: center;
  }
    
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
  }
</style>
</head>
<body>

<ul>
  <li><a href="schedule.html">Schedule</a></li>
  <li><a href="#news">Information Input</a></li>
</ul>

<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Daily schedule</h1>

  <table style="margin-left: auto; margin-right: auto;">
    <thead>
      <tr>
        <th>Time</th>
        <th>Task</th>
        <!-- <th>Duration</th> -->
      </tr>
    </thead>
    <tbody>
      {% for item in schedule %}
      <tr>
        <td>{{ item.start_time }} – {{ item.end_time }}</td>
        <td>{{ item.task }}</td>
        <!--<td>{{ item.duration }} min</td> -->
      </tr>
      {% endfor %}
</tbody>
  </table>
</body>
</html>
