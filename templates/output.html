<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% for item in schedule %}
  <div class="block">
    <span class="time">{{ item.start_time }}</span>
    <span class="task">{{ item.task }}</span>
    <span class="duration">{{ item.duration }} minutes</span>
  </div>
{% endfor %}
</body>
</html>
